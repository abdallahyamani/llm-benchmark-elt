name: Daily LLM Benchmark Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src
        env:
          LLM_BENCHMARK_API: ${{ secrets.LLM_BENCHMARK_API }}

      - name: Upload Gold tables
        uses: actions/upload-artifact@v4
        with:
          name: gold-tables-${{ github.run_id }}
          path: data/gold/
          retention-days: 30

      - name: Generate results chart
        run: python scripts/gold_results.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ README.md
          git diff --cached --quiet || git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
          git push
